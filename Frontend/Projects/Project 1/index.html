<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Banner</title>
    <link rel="stylesheet" href="style.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <div class="Background">
            <img src="./Images/bg_image.png" alt="Background Image">
        </div>

        <div class="content">
            <img src="./Images/burger.png" alt="Burger" class="Burger">
            <img src="./Images/tomato.png" alt="Tomato" class="Tomato-1">
            <img src="./Images/tomato.png" alt="Tomato" class="Tomato-2">
            <img src="./Images/pizza.png" alt="Pizza" class="Pizza">
            <img src="./Images/momo.png" alt="Momo" class="Momo">
            <img src="./Images/leaf.png" alt="Leaf" class="Leaf">

            <div class="center-content">
            <section class="text-content">
                <h1>Better Food<br/>
                for more people</h1>
                <p>For over a decade we've enabled our customers to discover new tastes,deliver right to their doorstep</p>
            </section>

            <section class="info-section">
                <div class="info-item">
                    <img src="./Images/house.png" alt="Restaurant Icon">
                    <div class="info-text">
                        <span class="info-number">3,50,000+</span>
                        <span class="info-label">Restaurants</span>
                    </div>
                </div>

                <div class="info-item">
                    <img src="./Images/location.png" alt="location Icon">
                    <div class="info-text">
                        <span class="info-number">850+</span>
                        <span class="info-label">Cities</span>
                    </div>
                </div>

                <div class="info-item">
                    <img src="./Images/banner.png" alt="Banner Icon">
                    <div class="info-text">
                        <span class="info-number">3.5 billions+ </span>
                        <span class="info-label">Orders Delivered </span>
                    </div>
                </div>
            </section>
        </div>
        </div>

        
    </main>
</body>
</html>
